name: Run Ketab Library Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Telegram Bot
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir python-telegram-bot==22.6

      - name: Verify Telegram package
        run: |
          python -c "import telegram; print('Telegram package OK:', telegram.__version__)"

      - name: Run Telegram bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python -m bot.main
